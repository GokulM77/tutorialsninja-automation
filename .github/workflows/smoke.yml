name: smoke

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Run smoke tests (TestNG smoke group + Cucumber @smoke, headless)
        env:
          TN_VALID_EMAIL: ${{ secrets.TN_VALID_EMAIL }}
          TN_VALID_PASSWORD: ${{ secrets.TN_VALID_PASSWORD }}
        run: mvn -B test -Dgroups=smoke,cucumber -Dcucumber.filter.tags=@smoke -Dheadless=true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-evidence
          path: |
            target/reports
            target/screenshots
            target/surefire-reports